<title>Legend model — what TAHI blocks</title>
<style>
  :root{
    --paper:#F8F9FA; --panel:#FFFFFF; --ink:#101419; --ink2:#5C6672; --ink3:#8A94A1;
    --rule:#D8DDE3; --rule2:#EBEEF2; --accent:#1F51A8; --accent-soft:rgba(31,81,168,.10);
    --bad:#B3261E; --bad-soft:rgba(179,38,30,.10); --good:#0F7A4D;
    --logo-filter:none; --node:#5C6672;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0C0F13; --panel:#12171D; --ink:#E8ECF1; --ink2:#96A1AE; --ink3:#6B7683;
      --rule:#232A33; --rule2:#1A2027; --accent:#6FA0F0; --accent-soft:rgba(111,160,240,.16);
      --bad:#FF8A80; --bad-soft:rgba(255,138,128,.14); --good:#4ADE80;
      --logo-filter:invert(1); --node:#7C8899;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0C0F13; --panel:#12171D; --ink:#E8ECF1; --ink2:#96A1AE; --ink3:#6B7683;
    --rule:#232A33; --rule2:#1A2027; --accent:#6FA0F0; --accent-soft:rgba(111,160,240,.16);
    --bad:#FF8A80; --bad-soft:rgba(255,138,128,.14); --good:#4ADE80;
    --logo-filter:invert(1); --node:#7C8899;
  }
  :root[data-theme="light"]{
    --paper:#F8F9FA; --panel:#FFFFFF; --ink:#101419; --ink2:#5C6672; --ink3:#8A94A1;
    --rule:#D8DDE3; --rule2:#EBEEF2; --accent:#1F51A8; --accent-soft:rgba(31,81,168,.10);
    --bad:#B3261E; --bad-soft:rgba(179,38,30,.10); --good:#0F7A4D;
    --logo-filter:none; --node:#5C6672;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
       font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased;}
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

  header{display:flex;align-items:center;gap:20px;flex-wrap:wrap;
         padding:12px 18px;border-bottom:1px solid var(--rule);background:var(--panel);}
  .logo{height:26px;width:auto;filter:var(--logo-filter);flex:none;}
  h1{font:650 14px/1.2 var(--sans);margin:0;letter-spacing:-.01em;}
  h1 span{display:block;font:500 11px/1.4 var(--sans);color:var(--ink3);
          letter-spacing:.04em;text-transform:uppercase;margin-top:3px;}
  .spring{flex:1;}
  .headline{display:flex;gap:20px;align-items:baseline;}
  .hs b{font:500 20px/1 var(--mono);font-variant-numeric:tabular-nums;}
  .hs .off{color:var(--bad);} .hs .on{color:var(--good);}
  .hs span{display:block;font:600 9.5px/1.3 var(--sans);letter-spacing:.09em;
           text-transform:uppercase;color:var(--ink3);margin-top:4px;}

  .controls{display:flex;gap:8px;align-items:center;padding:10px 18px;
            border-bottom:1px solid var(--rule);background:var(--panel);flex-wrap:wrap;}
  button.view{font:600 11px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;
       padding:8px 13px;border:1px solid var(--rule);background:transparent;
       color:var(--ink2);border-radius:3px;cursor:pointer;}
  button.view[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  @media (prefers-color-scheme:dark){
    button.view[aria-pressed="true"]{color:#0C0F13;}
  }
  :root[data-theme="dark"] button.view[aria-pressed="true"]{color:#0C0F13;}
  :root[data-theme="light"] button.view[aria-pressed="true"]{color:#fff;}
  input[type=search]{font:13px var(--mono);padding:7px 11px;border:1px solid var(--rule);
       border-radius:3px;background:var(--paper);color:var(--ink);min-width:220px;}
  label.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);
            cursor:pointer;user-select:none;}
  .note{font-size:12px;color:var(--ink3);}

  main{flex:1;display:flex;min-height:0;}
  #stage{flex:1;position:relative;min-width:0;background:var(--paper);}
  canvas{display:block;width:100%;height:100%;cursor:grab;}
  canvas.dragging{cursor:grabbing;}
  .key{position:absolute;left:14px;bottom:14px;background:var(--panel);
       border:1px solid var(--rule);border-radius:4px;padding:10px 12px;font-size:11.5px;
       color:var(--ink2);line-height:1.9;pointer-events:none;}
  .key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;
         vertical-align:middle;}
  .hint{position:absolute;right:14px;bottom:14px;font-size:11.5px;color:var(--ink3);
        pointer-events:none;text-align:right;}

  aside{width:400px;flex:none;border-left:1px solid var(--rule);background:var(--panel);
        overflow-y:auto;padding:20px;}
  @media (max-width:900px){
    main{flex-direction:column;} aside{width:auto;border-left:none;
      border-top:1px solid var(--rule);max-height:52vh;}
    #stage{min-height:44vh;}
  }
  aside h2{font:650 10px/1 var(--sans);letter-spacing:.13em;text-transform:uppercase;
           color:var(--ink3);margin:0 0 12px;}
  aside h2:not(:first-child){margin-top:28px;}
  .cls{font:600 15px/1.35 var(--mono);word-break:break-all;margin:0 0 4px;}
  .pkg{font:12px/1.5 var(--mono);color:var(--ink3);word-break:break-all;margin:0 0 18px;}
  table{border-collapse:collapse;width:100%;font-size:12.5px;}
  td{padding:5px 8px 5px 0;border-bottom:1px solid var(--rule2);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  td.p{font-family:var(--mono);}
  td.t{font-family:var(--mono);color:var(--ink3);text-align:right;white-space:nowrap;}
  .chip{display:inline-block;font:12px/1.5 var(--mono);padding:2px 7px;margin:0 5px 5px 0;
        border-radius:3px;border:1px solid var(--rule);}
  .chip.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft);
            text-decoration:line-through;}
  .chip.ok{color:var(--ink);}
  .chip.gold{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
  .verdict{font-size:12.5px;color:var(--ink2);margin:10px 0 0;}
  .verdict b{color:var(--bad);} .verdict b.g{color:var(--good);}
  .empty{color:var(--ink3);font-size:13px;}
  footer{padding:12px 18px;border-top:1px solid var(--rule);background:var(--panel);
         font-size:11.5px;color:var(--ink3);}
  a{color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>

const S = PAYLOAD.summary;
document.getElementById('s-off').textContent = (S.made_up_off*100).toFixed(1)+'%';
document.getElementById('s-on').textContent  = (S.made_up_on*100).toFixed(0)+'%';
document.getElementById('s-n').textContent   = S.n;
document.getElementById('foot').innerHTML =
  'Parsed from ' + S.classes + ' classes / ' + S.vocab + ' distinct property names in '
  + '<code>finos/legend-engine</code> <code>.pure</code> sources — a parse, not an extraction. '
  + 'Answers generated by ' + S.model + '. <strong>w/o TAHI</strong> the model answers on its own; '
  + '<strong>with TAHI</strong> the decoder can only emit property names the model actually declares. '
  + 'Nothing here is a benchmark: it shows the filter working, on one question type.';

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const panel = document.getElementById('panel');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

let view='protocol', nodes=[], links=[], sel=null, hover=null;
let tx=0, ty=0, scale=1, alpha=1, raf=null;
let query='', onlyBad=false;

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function invented(n){ return n.test && n.test.off_bad && n.test.off_bad.length>0; }
function tested(n){ return !!n.test; }

function load(name){
  view = name;
  const d = PAYLOAD.views[name].data;
  const W = cv.clientWidth||900, H = cv.clientHeight||600;
  nodes = d.nodes.map(n => ({...n,
    x: W/2 + (Math.random()-0.5)*W*0.6,
    y: H/2 + (Math.random()-0.5)*H*0.6, vx:0, vy:0,
    r: Math.min(16, 4 + Math.sqrt(n.degree)*2.1)}));
  links = d.links.map(l => ({...l, s:nodes[l.s], t:nodes[l.t]}));
  sel = null; tx=0; ty=0; scale=1; alpha=1;
  document.getElementById('v-demo').setAttribute('aria-pressed', name==='demo');
  document.getElementById('v-protocol').setAttribute('aria-pressed', name==='protocol');
  document.getElementById('counts').textContent =
    nodes.length + ' classes · ' + links.length + ' relationships · '
    + nodes.filter(invented).length + ' where it invented a name';
  renderPanel(null);
  if (reduce){ for(let i=0;i<300;i++) step(); alpha=0; }
  start();
}

function step(){
  const W = cv.clientWidth||900, H = cv.clientHeight||600;
  const k = 0.05;
  for (let i=0;i<nodes.length;i++){
    const a = nodes[i];
    for (let j=i+1;j<nodes.length;j++){
      const b = nodes[j];
      let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy;
      if (d2<0.01){ dx=Math.random()-0.5; dy=Math.random()-0.5; d2=0.01; }
      if (d2>90000) continue;
      const f = 420/d2, d=Math.sqrt(d2);
      const fx=f*dx/d, fy=f*dy/d;
      a.vx-=fx; a.vy-=fy; b.vx+=fx; b.vy+=fy;
    }
  }
  for (const l of links){
    const dx=l.t.x-l.s.x, dy=l.t.y-l.s.y;
    const d=Math.sqrt(dx*dx+dy*dy)||1, f=(d-70)*0.012;
    const fx=f*dx/d, fy=f*dy/d;
    l.s.vx+=fx; l.s.vy+=fy; l.t.vx-=fx; l.t.vy-=fy;
  }
  for (const n of nodes){
    n.vx += (W/2-n.x)*0.0016; n.vy += (H/2-n.y)*0.0016;
    n.vx*=0.86; n.vy*=0.86;
    n.x += n.vx*k*20; n.y += n.vy*k*20;
  }
}

function visible(n){
  if (onlyBad && !invented(n)) return false;
  if (!query) return true;
  const q = query.toLowerCase();
  if (n.name.toLowerCase().includes(q)) return true;
  return n.props.some(p => p.n.toLowerCase().includes(q));
}

function draw(){
  const dpr = devicePixelRatio||1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== W*dpr || cv.height !== H*dpr){ cv.width=W*dpr; cv.height=H*dpr; }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(tx,ty); ctx.scale(scale,scale);

  const C = {rule:css('--rule'), node:css('--node'), bad:css('--bad'),
             accent:css('--accent'), ink:css('--ink'), ink3:css('--ink3'), panel:css('--panel')};
  const nbrs = new Set();
  const focus = hover||sel;
  if (focus) for (const l of links){
    if (l.s===focus) nbrs.add(l.t); if (l.t===focus) nbrs.add(l.s);
  }

  ctx.lineWidth = 1/scale;
  for (const l of links){
    const on = focus && (l.s===focus||l.t===focus);
    const vis = visible(l.s)&&visible(l.t);
    ctx.strokeStyle = on ? C.accent : C.rule;
    ctx.globalAlpha = on ? 0.95 : (focus?0.16:(vis?0.5:0.1));
    ctx.lineWidth = (on?1.8:1)/scale;
    ctx.beginPath(); ctx.moveTo(l.s.x,l.s.y); ctx.lineTo(l.t.x,l.t.y); ctx.stroke();
  }

  for (const n of nodes){
    const vis = visible(n);
    const dim = focus && n!==focus && !nbrs.has(n);
    ctx.globalAlpha = vis ? (dim?0.22:1) : 0.08;
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,6.284);
    ctx.fillStyle = !tested(n) ? C.panel : (invented(n) ? C.bad : C.node);
    ctx.fill();
    ctx.lineWidth = (n===sel?2.5:1)/scale;
    ctx.strokeStyle = n===sel ? C.accent : (!tested(n) ? C.ink3 : C.panel);
    ctx.stroke();
  }

  const showLabels = scale>1.35 || nodes.length<60 || focus || query;
  if (showLabels){
    ctx.font = (11/scale<6?6:11/scale) + 'px ui-monospace,SFMono-Regular,Menlo,monospace';
    ctx.textAlign='center'; ctx.textBaseline='top';
    for (const n of nodes){
      if (!visible(n)) continue;
      if (focus && n!==focus && !nbrs.has(n)) continue;
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = C.ink;
      ctx.fillText(n.short, n.x, n.y + n.r + 3/scale);
    }
  }
  ctx.globalAlpha=1; ctx.restore();
}

function start(){ if (!raf) raf = requestAnimationFrame(loop); }
function loop(){
  raf=null;
  if (alpha>0.005){ step(); alpha*=0.985; }
  draw();
  if (alpha>0.005 || dirty){ dirty=false; raf=requestAnimationFrame(loop); }
}
let dirty=false;
function nudge(){ dirty=true; start(); }

function at(mx,my){
  const x=(mx-tx)/scale, y=(my-ty)/scale;
  let best=null, bd=1e9;
  for (const n of nodes){
    if (!visible(n)) continue;
    const d=(n.x-x)**2+(n.y-y)**2;
    if (d<bd && d < (n.r+6)**2){ bd=d; best=n; }
  }
  return best;
}

function esc(s){ return String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderPanel(n){
  if (!n){
    panel.innerHTML = '<h2>Inspector</h2><p class="empty">Click a class in the graph.<br><br>'
      + 'Every node is a class parsed from Legend <code>.pure</code> source. Every line between '
      + 'them is a property whose type is another class — the model\'s own relationships, not '
      + 'anything inferred.<br><br>Red nodes are classes where the model wrote down a property '
      + 'name that does not exist.</p>';
    return;
  }
  let h = '<h2>Class</h2><p class="cls">'+esc(n.short)+'</p><p class="pkg">'+esc(n.pkg)+'</p>';
  h += '<h2>Declared properties &nbsp;<span style="color:var(--ink3);font-weight:400">'
     + n.props.length + '</span></h2><table>';
  for (const p of n.props){
    h += '<tr><td class="p">'+esc(p.n)+'</td><td class="t">'+esc(p.t)
       + '<span style="opacity:.6">['+esc(p.m)+']</span></td></tr>';
  }
  h += '</table>';

  if (!n.test){
    h += '<h2>Model output</h2><p class="empty">This class was not in the tested sample '
       + '(only classes with 3 or more properties were asked about).</p>';
  } else {
    const t = n.test;
    const bad = new Set(t.off_bad);
    h += '<h2>Asked: what properties does this class declare?</h2>';
    h += '<p style="font-size:12px;color:var(--ink3);margin:0 0 8px">w/o TAHI — '
       + 'the model answers on its own</p><div>';
    if (!t.off.length) h += '<span class="empty">(nothing)</span>';
    for (const x of t.off)
      h += '<span class="chip '+(bad.has(x)?'bad':'ok')+'">'+esc(x)+'</span>';
    h += '</div>';
    if (t.off_bad.length)
      h += '<p class="verdict"><b>'+t.off_bad.length+' of '+t.off.length
         + '</b> do not exist anywhere in the model.</p>';
    else
      h += '<p class="verdict"><b class="g">All exist</b> in the model.</p>';

    h += '<p style="font-size:12px;color:var(--ink3);margin:22px 0 8px">with TAHI — '
       + 'same model, same prompt; the decoder can only emit names that exist</p><div>';
    if (!t.on.length) h += '<span class="empty">(nothing)</span>';
    for (const x of t.on) h += '<span class="chip ok">'+esc(x)+'</span>';
    h += '</div><p class="verdict"><b class="g">0 invented</b> — it cannot write a name '
       + 'that is not in the model.</p>';

    h += '<h2>The correct answer</h2><div>';
    for (const x of t.gold) h += '<span class="chip gold">'+esc(x)+'</span>';
    h += '</div><p class="verdict">TAHI supplies vocabulary, not knowledge: it stops the '
       + 'model inventing names, but does not tell it which of the real ones to pick.</p>';
  }
  panel.innerHTML = h;
}

let drag=null;
cv.addEventListener('pointerdown', e=>{
  drag={x:e.clientX, y:e.clientY, tx, ty, moved:false};
  cv.setPointerCapture(e.pointerId); cv.classList.add('dragging');
});
cv.addEventListener('pointermove', e=>{
  const r = cv.getBoundingClientRect();
  if (drag){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
    if (Math.abs(dx)+Math.abs(dy)>3) drag.moved=true;
    tx=drag.tx+dx; ty=drag.ty+dy; nudge(); return;
  }
  const h = at(e.clientX-r.left, e.clientY-r.top);
  if (h!==hover){ hover=h; cv.style.cursor = h?'pointer':'grab'; nudge(); }
});
cv.addEventListener('pointerup', e=>{
  cv.classList.remove('dragging');
  if (drag && !drag.moved){
    const r = cv.getBoundingClientRect();
    sel = at(e.clientX-r.left, e.clientY-r.top);
    renderPanel(sel); nudge();
  }
  drag=null;
});
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  const f = e.deltaY<0 ? 1.12 : 1/1.12;
  const ns = Math.min(6, Math.max(0.25, scale*f));
  tx = mx - (mx-tx)*(ns/scale); ty = my - (my-ty)*(ns/scale);
  scale = ns; nudge();
}, {passive:false});

document.getElementById('v-demo').onclick = ()=>load('demo');
document.getElementById('v-protocol').onclick = ()=>load('protocol');
document.getElementById('q').addEventListener('input', e=>{ query=e.target.value.trim(); nudge(); });
document.getElementById('only-bad').addEventListener('change', e=>{ onlyBad=e.target.checked; nudge(); });
addEventListener('resize', nudge);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', nudge);

load('protocol');
</script>
