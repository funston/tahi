[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tahi"
version = "0.1.0"
description = "Tahi core runtime for world-model coprocessors"
readme = "README.md"
requires-python = ">=3.11"
authors = [
 { name = "Rich Schiavi" }
]
license = "Apache-2.0"
dependencies = [
 "numpy>=1.26",
 "sqlglot>=25.0",
]

[project.optional-dependencies]
ann = [
 "faiss-cpu>=1.8.0",
 "sentence-transformers>=3.0",
]
dev = [
 "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tahi*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/legacy", "third_party"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade, B bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
  "E501",    # line length is enforced by the formatter, not the linter
  "B008",    # function call in default arg -- argparse patterns rely on it
]

[tool.ruff.lint.per-file-ignores]
# Benchmark and script entry points insert sys.path before importing tahi.
"scripts/*" = ["E402"]
"benchmarks/*" = ["E402"]
"tests/*" = ["E402"]
