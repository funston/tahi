[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bender-coprocessor"
version = "0.1.0"
description = "BENDER core runtime for world-model coprocessors"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Rich Schiavi" }
]
license = "Apache-2.0"
dependencies = [
  "numpy>=1.26",
  "sqlglot>=25.0",
]

[project.optional-dependencies]
ann = [
  "faiss-cpu>=1.8.0",
  "sentence-transformers>=3.0",
]
dev = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["bender*"]
